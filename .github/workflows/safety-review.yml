name: safety-review
# Two approvals from the safety reviewers (the /rules/ owners in CODEOWNERS) for any safety change to a country file or to the code that reads
# them (rules/review.py GUARDED_CODE).
# Re-runs when a review lands, so an approval turns the check green without a new push.
# On pull_request_target this file, the check and CODEOWNERS all come from the base branch. On pull_request_review GitHub
# runs this file as the pull request has it, so a pull request could change that run; code-owner review of the file and
# branch protection on main cover that. As written here, both run the base branch's check and only read the pull
# request's code.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths: ["rules/*.yaml", ".github/CODEOWNERS", "rules/g0.py", "rules/reading.py", "rules/compose.py",
            "rules/steps.py", "rules/engine.py", "rules/text.py",
            "rules/country.py", "rules/disclaimer.py", "rules/review.py", ".github/workflows/safety-review.yml"]
  pull_request_review:
    types: [submitted, dismissed]
permissions:
  contents: read
  pull-requests: read
jobs:
  two-approvals:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          version: "0.12.21"
      - run: uv python install 3.12
      - run: uv run --quiet python -m rules.review --tree ../pr --base "origin/$BASE_REF" --pr "$PR_NUMBER"
        working-directory: base
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
