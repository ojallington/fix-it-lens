name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          version: "0.12.21"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "26.8.1"
          cache: npm
          cache-dependency-path: contracts/ts/package-lock.json
      - run: uv python install 3.12
      # The video witness builds its clips with ffmpeg, and the runner image has none.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # No key and no network calls: calls/ runs in replay mode (FIXIT_CALLS unset) and live tests are deselected.
      - run: make ci
