# The United States. In words: schema/rules.md. Same zones as nl.yaml; written from the design's country table: leave, then
# 911 or the gas utility; gas and electrical work by a contractor licensed in your state; a sealed boiler's user
# actions per its manufacturer's user guide, and on a furnace only the filter change and the reset. Rules differ by
# state; this file holds what is the same in all of them. Pages are never written here.
# Every source was looked up on 2026-10-26; one that could not be found says (unverified). Appliance manuals are cited
# by title and section, as in nl.yaml.
#
# How G0 reads this table: see nl.yaml. Zones smell, alarm, fire, burning, flood and breaker_repeat are also things
# The user says: on those the user's own words stop the repair.
country: us
version: 1.0.0
languages: [en]
emergency:
  en: "In danger: call 911. Smell gas? Leave the building first, then call 911 or your gas utility's emergency line from outside."

allow_lists:
  sealed_boiler:
    - id: read_pressure
      names: {en: read the pressure}
      sources: &boiler_user
        - {title: "The boiler manufacturer's user guide, as the card cites it (the same four actions)"}
    - id: top_up
      names: {en: top up at the fill valve}
      sources: *boiler_user
    - id: bleed_radiators
      names: {en: bleed a radiator}
      sources: *boiler_user
    - id: reset_per_manual
      names: {en: reset per the manual}
      sources: *boiler_user
    - id: power_cycle
      names: {en: switch the boiler off and on}
      sources: *boiler_user
    # Furnaces: the filter change and the reset only. A furnace card is kind boiler with these job ids.
    - id: change_filter
      names: {en: change the furnace filter}
      sources:
        - {title: "The furnace manufacturer's user guide, as the card cites it (filter change and reset only)"}

rules:
  # ---------- Emergencies: fixed scripts, said at once. The gas-smell and CO scripts are never merged. ----------
  - id: us.gas.smell
    family: gas
    zone: smell
    parts:
      en: [smell gas, smell of gas, smells of gas, smells like gas, gas smell, gas leak, hissing gas, gas hissing]
    verbs: {en: []}
    action: STOP
    line:
      en: "Smell gas? Leave first, then call 911 or your gas utility from outside."
    script:
      en: "If you smell gas, leave now and take everyone with you. Don't use flames, switches or phones inside, and don't start a car nearby. Then, from outside, call 911 or your gas utility's emergency line."
    ring_cm: 3
    landlord: false
    sources:
      - {title: "PHMSA: recognizing and responding to pipeline emergencies (leave, then call 911 from well away)", url: "https://primis.phmsa.dot.gov/comm/emergencyresponse.htm"}
    look_only_exemptions: []

  - id: us.co.alarm
    family: co
    zone: alarm
    parts:
      en: [co alarm, co detector, carbon monoxide, flue gas smell, smell of flue gas, fumes from the boiler]
    verbs: {en: []}
    action: STOP
    line:
      en: "Carbon monoxide alarm? Go outside and call 911 from outside."
    script:
      en: "A carbon monoxide alarm means leave now. Warn everyone in the house, go outside to fresh air, and call 911 from outside. Don't go back in until the emergency services say it's safe."
    ring_cm: 3
    landlord: false
    sources:
      - {title: "US CPSC: carbon monoxide safety", url: "https://www.cpsc.gov/Safety-Education/Safety-Education-Centers/Carbon-Monoxide-Information-Center"}
    look_only_exemptions: []

  - id: us.heat.fire
    family: heat
    zone: fire
    parts:
      en: [smoke, on fire, flames, sparks, sparking, a fire]
    verbs: {en: []}
    action: STOP
    line:
      en: "Smoke or fire? Get everyone out and call 911."
    script:
      en: "Get everyone out, close the doors behind you and call 911."
    ring_cm: 3
    landlord: false
    sources:
      - {title: "Samsung WW5000C user manual", section: "Safety information"}
    look_only_exemptions: []

  - id: us.heat.burning
    family: heat
    zone: burning
    parts:
      en: [burning smell, smell of burning, smells burnt, smells like burning, smouldering, smoldering]
    verbs: {en: []}
    action: STOP
    line:
      en: "A burning smell is for the service engineer. I won't go on with this."
    script:
      en: "Stop using it. If the plug is dry and easy to reach, pull it out now; otherwise switch off its circuit at the breaker panel. Don't restart it. If you see smoke, leave and call 911. This needs the manufacturer's service."
    ring_cm: 3
    landlord: false
    sources:
      - {title: "Samsung WW5000C user manual", section: "Safety information: strange noise, burning smell or smoke"}
    look_only_exemptions: []

  - id: us.water.flood
    family: water
    zone: flood
    parts:
      en: [water on the socket, water near the socket, water on the plug, wet plug, wet socket, water on the outlet, wet outlet, water in the breaker panel, water in the breaker box, flooded]
    verbs: {en: []}
    action: STOP
    line:
      en: "Water near the power: don't touch the plug. I won't go on with this."
    script:
      en: "Don't touch the plug or the outlet with wet hands. Turn off the water at the shutoff valve, then switch off the power at the breaker panel: that circuit, or the main switch, if you can reach it without standing in water. Then call service. I won't continue this repair."
    ring_cm: 3
    landlord: false
    sources:
      - {title: "Samsung WW5000C user manual", section: "Safety information: flooded appliance, wet hands"}
    look_only_exemptions: []

  # ---------- Gas: only a contractor licensed for gas in your state works on gas. ----------
  - id: us.gas.tap
    family: gas
    zone: tap
    parts:
      en: [gas tap, gas valve, gas pipe, gas line, gas supply, gas cock, gas shut off, gas shutoff, gas isolation valve, emergency control valve, yellow tap, yellow handle, burner, pilot light, pilot assembly, burner compartment, furnace burner, gas inlet, gas hose, gas connection, gas fitting]
    verbs: {en: []}
    action: STOP
    line:
      en: "That's the gas supply. Gas work needs a licensed gas contractor. Smell gas? Leave, then call 911."
    script:
      en: "That's the gas supply: hands back. If you were topping up the boiler, close the fill valve. Gas work needs a licensed gas contractor. Smell gas? Leave, then call 911 or your gas utility."
    ring_cm: 3
    landlord: true
    sources:
      - {title: "State contractor licensing: gas fitting is licensed per state (unverified per state)"}
    # The guide's own look-only card line. Exactly this line passes the part-name hold; any edit is held.
    #   21725f85…: "The yellow tap is gas. Check it's open: just look."
    look_only_exemptions:
      - 21725f8528f3df1106ba28c83b635b761ea98d53cf334c182d6d7ceab8719578

  - id: us.gas.casing
    family: gas
    zone: casing
    parts:
      en: [boiler casing, boiler front panel, front cover of the boiler, front panel of the boiler, inside the boiler, open the boiler, boiler front cover, boiler's front cover, front off the boiler, cover off the boiler, cover on the boiler, front of the boiler open, front of the boiler off]
    verbs: {en: []}
    action: STOP
    line:
      en: "Opening the boiler casing is for a licensed gas contractor."
    script:
      en: "I'll stop here. Opening the casing is for a licensed gas contractor, both legally and for safety. What I can help with is the pressure, topping up, bleeding radiators and a reset."
    ring_cm: 3
    landlord: true
    sources:
      - {title: "State contractor licensing: gas fitting is licensed per state (unverified per state)"}
      - {title: "The boiler manufacturer's user guide, as the card cites it"}
    look_only_exemptions: []

  - id: us.gas.boiler
    family: gas
    zone: boiler
    parts:
      en: [heat exchanger, ignition electrode, ignition probe, ionisation probe, combustion chamber, boiler fan, boiler circuit board, boiler pcb, gas valve on the boiler]
    verbs: {en: []}
    action: STOP
    line:
      en: "That's inside the boiler. It's for a licensed gas contractor."
    script:
      en: "I'll stop here. Anything beyond the pressure, topping up, bleeding and a reset is for a licensed gas contractor. Those I can help with."
    ring_cm: 3
    landlord: true
    sources:
      - {title: "State contractor licensing: gas fitting is licensed per state (unverified per state)"}
    look_only_exemptions: []

  - id: us.gas.flue
    family: gas
    zone: flue
    parts:
      en: [flue, condensate drain, condensate pipe, condensate trap, condensate siphon, condensate line, condensate outlet,
          air intake pipe, boiler chimney, carries the fumes, fumes out of the boiler, exhaust pipe]
    verbs: {en: []}
    action: STOP
    line:
      en: "The flue and the condensate pipe are for a licensed gas contractor. In an apartment with a shared flue, ask your building manager."
    script:
      en: "I'll stop here. The flue and the condensate pipe are for a licensed gas contractor. If you're in an apartment with a shared flue, your building manager or HOA is responsible."
    ring_cm: 3
    landlord: true
    sources:
      - {title: "State contractor licensing: gas fitting is licensed per state (unverified per state)"}
    look_only_exemptions: []

  - id: us.pressure.relief_valve
    family: pressure
    zone: relief_valve
    parts:
      en: [safety valve, relief valve, pressure relief, expansion vessel, prv, t&p valve, tp valve, temperature and pressure relief, red valve on the boiler]
    verbs: {en: []}
    action: STOP
    line:
      en: "Leave the pressure relief valve alone. That's for the engineer."
    script:
      en: "Close the fill valve now. The pressure is too high. Leave the pressure relief valve alone and call a licensed gas contractor."
    ring_cm: 3
    landlord: true
    sources:
      - {title: "The boiler manufacturer's user guide, as the card cites it"}
    look_only_exemptions: []

  - id: us.pressure.repeat_top_up
    family: pressure
    zone: repeat_top_up
    parts:
      en: [keep topping up, keeps losing pressure, top up every week, leak sealer]
    verbs: {en: []}
    action: STOP
    line:
      en: "Topping up often usually means a leak or a tired expansion vessel. Call the engineer."
    script:
      en: "You've topped up more than twice in the past twelve months. That usually means a leak or a tired expansion vessel. Please call a licensed gas contractor; I won't walk another top-up."
    ring_cm: 3
    landlord: true
    sources:
      - {title: "The boiler manufacturer's user guide, as the card cites it (repeat top-ups: unverified per brand)"}
    look_only_exemptions: []

  # ---------- Mains: the casing fires whatever the power state. A tripped breaker goes back on once. ----------
  - id: us.mains.casing
    family: mains
    zone: casing
    parts:
      en: [back panel, rear panel, outer panel, casing, housing, top panel, side panel, worktop panel, kick plate, toe kick, base plate, behind the drum, panel at the rear, panel on the back, outer shell, metal shell, rear cover, the back off, plate under the door, plate on the side, cover off the back, back cover off, cover on the back, control board, circuit board, pcb, rear sheet, back sheet]
    verbs: {en: []}
    action: STOP
    line:
      en: "There is mains power behind the back panel. This needs a technician."
    script:
      en: "Hands off: there is mains power behind the back panel. Leave it on; this needs a technician."
    ring_cm: 5
    landlord: false
    sources:
      - {title: "Samsung WW5000C user manual", section: "Safety information: do not attempt to repair, disassemble, or modify the appliance yourself"}
    look_only_exemptions: []

  - id: us.mains.wiring
    family: mains
    zone: wiring
    parts:
      en: [wiring, bare wire, exposed wire, live wire, terminal block, inside the socket, socket faceplate, unscrew the socket, outlet cover plate, inside the outlet, junction box, open up the wall outlet, open the outlet, the wires inside, join the wires, strip the cable, strip back the, earth wire, neutral wire, mains connection, mains terminal, mains terminals, wiring terminal, wiring terminals, supply terminal, supply terminals, live terminal, neutral terminal, earth terminal, mains terminal cover, wiring terminal cover, supply terminal cover, cooker terminal cover, hob terminal cover, oven terminal cover, terminal cover on the back, terminal cover at the back, choc block, chocolate block, connector block, connection block, junction box, screw terminal, spade connector, spade terminal, wiring connector, electrical connector, wiring loom, wiring harness, plug socket inside, socket inside the machine, plug connector]
    verbs: {en: []}
    action: STOP
    line:
      en: "That's electrical work. Only a licensed electrician opens outlets or wiring."
    script:
      en: "That's electrical work. Only a licensed electrician should open outlets, junction boxes or the breaker panel. I'll stop here."
    ring_cm: 3
    landlord: true
    sources:
      - {title: "State electrical licensing: electrical work is licensed per state (unverified per state)"}
      - {title: "Implied warranty of habitability (state law): heat, gas and electrical systems are the landlord's (unverified per state)"}
    look_only_exemptions: []

  - id: us.mains.consumer_unit
    family: mains
    zone: consumer_unit
    parts:
      en: [breaker panel cover, electrical panel cover, inside the breaker panel, inside the electrical panel, busbar, meter seal, main fuse, service drop, distribution board cover, cover off the fuse board, cover off the consumer unit, cover off the fuse box, lid off the breaker box, breaker box cover, fuse board cover, breaker module, din rail, service fuse, cutout fuse]
    verbs: {en: []}
    action: STOP
    line:
      en: "Inside the breaker panel is for a licensed electrician only. A broken meter seal or the service: call your electric utility."
    script:
      en: "I'll stop here. Opening the breaker panel is for a licensed electrician. The meter, its seal and the service belong to your electric utility: call them."
    ring_cm: 3
    landlord: true
    sources:
      - {title: "State electrical licensing: electrical work is licensed per state (unverified per state)"}
      - {title: "Your electric utility: the meter and the service drop are the utility's (unverified per utility)"}
    look_only_exemptions: []

  - id: us.mains.consumer_unit_open
    family: mains
    zone: consumer_unit_open
    parts:
      en: [breaker panel, electrical panel, fuse board, distribution board, gfci, afci, circuit breaker, breaker box]
    verbs:
      en: [unscrew, screw, dismantle, take the cover off, remove the cover, pry, prise, rewire, replace the breaker, swap the breaker]
    action: HOLD
    line:
      en: "Opening up the breaker panel is for a licensed electrician."
    script:
      en: "I'll stop here. Opening the breaker panel is for a licensed electrician."
    ring_cm: 3
    landlord: true
    sources:
      - {title: "State electrical licensing: electrical work is licensed per state (unverified per state)"}
    look_only_exemptions: []

  - id: us.mains.breaker
    family: mains
    zone: breaker
    parts:
      en: [breaker back on, breaker back up, trip switch back up, trip switch back on, gfci reset, reset the gfci, reset the breaker, reset the trip switch]
    verbs: {en: []}
    action: ALLOW
    line:
      en: "You can switch a tripped breaker back on once."
    script:
      en: "If it trips again, leave it off and call a licensed electrician."
    ring_cm: 3
    landlord: false
    sources:
      - {title: "Samsung WW5000C user manual", section: "Troubleshooting: the power supply (unverified)"}
    look_only_exemptions: []

  - id: us.mains.breaker_repeat
    family: mains
    zone: breaker_repeat
    parts:
      en: [trips again, tripped again, keeps tripping, trips straight away, won't stay on, wont stay on]
    verbs: {en: []}
    action: STOP
    line:
      en: "If the breaker trips again, it's for a licensed electrician."
    script:
      en: "Leave the breaker off. It has tripped a second time, so something is faulty. Unplug the appliance if that is safe to do, and call a licensed electrician."
    ring_cm: 3
    landlord: true
    sources:
      - {title: "Implied warranty of habitability (state law): heat, gas and electrical systems are the landlord's (unverified per state)"}
    look_only_exemptions: []

  # ---------- Names that a broader rule would otherwise catch (the over-blocking risk, c9 row 36). ----------
  - id: us.mains.user_covers
    family: mains
    zone: user_covers
    parts:
      en: [filter cover, filter flap, service flap, pump cover, filter housing, filter casing, breaker panel door, electrical panel door, casing of the debris filter, casing of the filter, debris filter casing, pump housing, drain pump housing, drain pump cover, sump cover, sump housing, pump lid, impeller cover]
    verbs: {en: []}
    action: ALLOW
    line:
      en: "That flap is yours: the manual has you open it."
    script:
      en: "That flap is yours: the manual has you open it."
    ring_cm: 3
    landlord: false
    sources:
      - {title: "Bosch SMV4HAX40N user manual", section: "Cleaning the drain pump (p. 59)"}
      - {title: "Samsung WW5000C user manual", section: "Maintenance: debris filter"}
    look_only_exemptions: []

  # ---------- Water and heat: the manuals' own preconditions. ----------
  - id: us.heat.hot_water
    family: heat
    zone: hot_water
    parts:
      en: [hot water, hot drain water, the water is hot, heating element, heater element]
    verbs:
      en: [touch, grab, reach, feel, hold, take out, remove, pull]
    action: HOLD
    line:
      en: "Wait: that water or that element may be hot. Let it cool first."
    script:
      en: "Wait: that may be hot. Let it cool first; I'll check back in a few minutes."
    ring_cm: 3
    landlord: false
    sources:
      - {title: "Samsung WW5000C user manual", section: "Safety information: water drained during a high-temperature cycle is hot"}
    look_only_exemptions: []

  - id: us.water.aquastop
    family: water
    zone: aquastop
    parts:
      en: [aquastop, water block valve, safety hose]
    verbs:
      en: [cut, open, take apart, submerge, unscrew, disconnect, remove, dismantle, take off, pull apart, bypass, loosen]
    action: HOLD
    line:
      en: "That's the leak protection. Close the water tap and call service."
    script:
      en: "That's the leak protection. Close the water tap and call service; don't keep using it. Never submerge the valve or cut the hose."
    ring_cm: 3
    landlord: false
    sources:
      - {title: "Bosch SMV4HAX40N instructions for use", section: "Safety: AquaStop"}
    look_only_exemptions: []

  - id: us.chemical.refrigerant
    family: chemical
    zone: refrigerant
    parts:
      en: [refrigerant, cooling circuit, freon, compressor, regas, coolant pipe, cooling loop, sealed loop]
    verbs: {en: []}
    action: STOP
    line:
      en: "That's the sealed cooling circuit. It needs an EPA 608 certified technician."
    script:
      en: "That's the sealed cooling circuit; only an EPA 608 certified technician works on it. Some fridges use flammable gas, so if it's hissing: ventilate, no flames, and unplug it if that's safe."
    ring_cm: 3
    landlord: false
    sources:
      - {title: "US EPA: Section 608 technician certification", url: "https://www.epa.gov/section608/section-608-technician-certification-requirements"}
    look_only_exemptions: []

  # ---------- What the model or the user reports when no other rule fits. ----------
  - id: us.mechanical.hazard
    family: mechanical
    zone: hazard
    parts:
      en: [damaged cable, frayed cable, damaged cord, frayed cord, broken cable, damaged power cord, frayed power cord]
    verbs: {en: []}
    action: STOP
    line:
      en: "That could be dangerous. I won't go on with this; it's for the service engineer."
    script:
      en: "If the plug is dry and easy to reach, pull it out; otherwise switch off its circuit at the breaker panel. Don't use it again until a service engineer has looked at it."
    ring_cm: 3
    landlord: false
    sources:
      - {title: "Bosch SMV4HAX40N instructions for use", section: "Safety: damaged appliance"}
    look_only_exemptions: []

  - id: us.mechanical.repeat_fault
    family: mechanical
    zone: repeat_fault
    parts:
      en: [code came back, code keeps coming back, same error again, same code again, keeps locking out]
    verbs: {en: []}
    action: STOP
    line:
      en: "If the fault comes back after the fix, it's for the engineer."
    script:
      en: "This came back after the fix, so it's not something to keep trying. Note the code; the engineer will ask for it."
    ring_cm: 3
    landlord: false
    sources:
      - {title: "The boiler manufacturer's user guide, as the card cites it"}
      - {title: "Samsung WW5000C user manual", section: "Information codes: if the information code remains"}
    look_only_exemptions: []
