      en: "That's inside the boiler. It needs a certified gas installer (CO-vrij)."
    script:
      nl: "Hier stop ik. Alles buiten de waterdruk, bijvullen, ontluchten en resetten is werk voor een CO-vrij gecertificeerd bedrijf. Daar help ik je wel mee."
      en: "I'll stop here. Anything beyond the pressure, topping up, bleeding and a reset needs a certified gas installer (CO-vrij). Those I can help with."
    ring_cm: 3
    landlord: true
    sources:
      - {title: "TLoKB: veelgestelde vragen over CO-vrij", url: "https://www.tlokb.nl/werkzaamheden-aan-gasverbrandingsinstallaties/veelgestelde-vragen-over-co-vrij"}
      - {title: "Rijksoverheid: hoe voorkom ik koolmonoxidevergiftiging in mijn huis?", url: "https://www.rijksoverheid.nl/documenten/vraag-en-antwoord/gezonde-en-veilige-leefomgeving/hoe-voorkom-ik-koolmonoxidevergiftiging-in-mijn-huis"}
    look_only_exemptions: []

  - id: nl.gas.flue
    family: gas
    zone: flue
    parts:
      nl: [rookgasafvoer, luchttoevoer, condensafvoer, condensaatafvoer, condensleiding, condensaatleiding, condenssifon,
          sifon van de ketel, sifon van de cv-ketel, ketelsifon, schoorsteen van de ketel, dakdoorvoer]
      en: [flue, condensate drain, condensate pipe, condensate trap, condensate siphon, condensate line, condensate outlet,
          air intake pipe, boiler chimney, carries the fumes, fumes out of the boiler, exhaust pipe]
    verbs: {nl: [], en: []}
    action: STOP
    line:
      nl: "De rookgasafvoer en de condensafvoer zijn voor de monteur. Bij een gedeelde afvoer in een flat: de VvE."
      en: "The flue and the condensate drain are engineer-only. In a flat with a shared flue, your VvE is responsible."
    script:
      nl: "Hier stop ik. De rookgasafvoer en de condensafvoer zijn voor een CO-vrij gecertificeerd bedrijf. Woon je in een flat met een gedeelde afvoer, dan is je VvE verantwoordelijk."
      en: "I'll stop here. The flue and the condensate drain need a certified gas installer (CO-vrij). If you're in a flat with a shared flue, your VvE is responsible."
    ring_cm: 3
    landlord: true
    sources:
      - {title: "Rijksoverheid: handreiking gemeenschappelijke rookgasafvoeren", url: "https://rijksoverheid.nl/binaries/rijksoverheid/documenten/publicaties/2023/02/01/handreiking-en-infoblad-gemeenschappelijke-rookgasafvoeren/Samen+voorkomen+we+koolmonoxidevergiftiging.pdf"}
    look_only_exemptions: []

  - id: nl.pressure.relief_valve
    family: pressure
    zone: relief_valve
    parts:
      nl: [overstortventiel, veiligheidsventiel, overdrukventiel, expansievat]
      en: [safety valve, relief valve, pressure relief, expansion vessel, red valve on the boiler]
    verbs: {nl: [], en: []}
    action: STOP
    line:
      nl: "Laat het overstortventiel met rust. Dat is voor de installateur."
      en: "Leave the safety valve alone. That's for the installer."
    script:
      nl: "Draai nu de kraan op de waterslang dicht, en dan de vulkraan. De druk is te hoog. Laat het overstortventiel met rust en bel een installateur."
      en: "Close the water tap now, then the fill valve. The pressure is too high. Leave the safety valve alone and call an installer."
    ring_cm: 3
    landlord: true
    sources:
      - {title: "Remeha Calenta Ace gebruikershandleiding", section: "Waterdruk: maximaal 3 bar"}
      - {title: "Nefit TrendLine II gebruikershandleiding", section: "Overstortventiel"}
    look_only_exemptions: []

  - id: nl.pressure.repeat_top_up
    family: pressure
    zone: repeat_top_up
    parts:
      nl: [steeds bijvullen, vaak bijvullen, telkens bijvullen, weer bijvullen na een week, lekstopmiddel]
      en: [keep topping up, keeps losing pressure, top up every week, leak sealer]
    verbs: {nl: [], en: []}
    action: STOP
    line:
      nl: "Vaak bijvullen betekent meestal een lek of een moe expansievat. Bel de installateur."
      en: "Topping up often usually means a leak or a tired expansion vessel. Call the engineer."
    script:
      nl: "Je hebt de afgelopen twaalf maanden al vaker bijgevuld. Dat betekent meestal een lek of een moe expansievat. Bel de installateur; ik vul nu niet verder bij."
      en: "You've topped up more than twice in the past twelve months. That usually means a leak or a tired expansion vessel. Please call the engineer; I won't walk another top-up."
    ring_cm: 3
    landlord: true
    sources:
      - {title: "Remeha Calenta classic gebruikershandleiding", section: "Bijvullen: 2 keer per jaar zou voldoende moeten zijn"}
      - {title: "Intergas Xtreme bedieningsvoorschrift", url: "https://intergas-verwarming.nl/app/uploads/2018/01/84008402-Bedieningsvoorschrift-Xtreme.pdf", section: "6"}
    look_only_exemptions: []

  # ---------- Mains: the casing fires whatever the power state. A tripped breaker goes back on once. ----------
