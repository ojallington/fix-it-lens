# The Netherlands. In words: schema/rules.md. Written from public sources (TLoKB, Rijksoverheid,
# Besluit kleine herstellingen, Liander, Enexis, co-wijzer, the Bosch, Samsung and Intergas user manuals).
# Pages are never written here: they differ by manual variant and come from the card.
# The Dutch strings are drafts until the maintainer checks them as a native speaker.
#
# How G0 reads this table: STOP rules are red-zone names, held whatever the verb; HOLD rules hold a part name paired
# with one of their verbs; ALLOW rules blank their own phrases out first, so a broader rule cannot match inside them.
# Zones smell, alarm, fire, burning, flood and breaker_repeat are also things the user says: on those the user's own
# words stop the repair.
country: nl
version: 1.0.0
languages: [nl, en]
emergency:
  nl: "Bij gevaar: bel 112. Ruik je gas? Ga naar buiten en bel 0800-9009 (gratis, dag en nacht)."
  en: "In danger: call 112. Smell gas? Go outside and call 0800-9009 (free, day and night)."

allow_lists:
  sealed_boiler:
    - id: read_pressure
      names: {nl: de waterdruk aflezen, en: read the pressure}
      sources: &boiler_user
        - {title: "TLoKB: veelgestelde vragen over CO-vrij", url: "https://www.tlokb.nl/werkzaamheden-aan-gasverbrandingsinstallaties/veelgestelde-vragen-over-co-vrij"}
        - {title: "Intergas Xtreme bedieningsvoorschrift", url: "https://intergas-verwarming.nl/app/uploads/2018/01/84008402-Bedieningsvoorschrift-Xtreme.pdf", section: "3.1, 6"}
    - id: top_up
      names: {nl: cv-water bijvullen bij de vulkraan, en: top up at the filling point}
      sources: &boiler_tenant
        - {title: "TLoKB: veelgestelde vragen over CO-vrij", url: "https://www.tlokb.nl/werkzaamheden-aan-gasverbrandingsinstallaties/veelgestelde-vragen-over-co-vrij"}
        - {title: "Besluit kleine herstellingen", url: "https://wetten.overheid.nl/BWBR0014931/", section: "bijlage, onder i"}
        - {title: "Intergas Xtreme bedieningsvoorschrift", url: "https://intergas-verwarming.nl/app/uploads/2018/01/84008402-Bedieningsvoorschrift-Xtreme.pdf", section: "6"}
    - id: bleed_radiators
      names: {nl: radiatoren ontluchten, en: bleed a radiator}
      sources: *boiler_tenant
    - id: reset_per_manual
      names: {nl: resetten volgens de handleiding, en: reset per the manual}
      sources: *boiler_tenant
    - id: power_cycle
      names: {nl: de ketel uit en weer aan zetten, en: switch the boiler off and on}
      sources: *boiler_user

rules:
  # ---------- Emergencies: fixed scripts, said at once. The gas-smell and CO scripts are never merged. ----------
  - id: nl.gas.smell
    family: gas
    zone: smell
    parts:
      nl: [ruik gas, ruik het gas, ruikt naar gas, ruik ik gas, ruik je gas, ruik jij gas, ruikt het naar gas, gaslucht, gaslek, stinkt naar gas, sist gas]
      en: [smell gas, smell of gas, smells of gas, smells like gas, gas smell, gas leak, hissing gas, gas hissing]
    verbs: {nl: [], en: []}
    action: STOP
    line:
      nl: "Ruik je gas? Ga naar buiten en bel 0800-9009."
      en: "Smell gas? Go outside and call 0800-9009."
    script:
      nl: "Ruik je gas? Zet ramen en deuren open, draai de hoofdgaskraan bij de meter dicht als dat kan, gebruik geen vuur en geen schakelaars, en ga met iedereen naar buiten. Bel dan buiten 0800-9009. Bij brand of als iemand onwel is: 112."
      en: "If you smell gas: open windows and doors, close the main gas valve at the meter if you can reach it, don't use flames or switches, and get everyone outside. Then call 0800-9009 from outside. If there is fire or someone is unwell, call 112."
    ring_cm: 3
    landlord: false
    sources:
      - {title: "Liander: ik ruik gas", url: "https://www.liander.nl/storingen-en-onderhoud/ik-ruik-gas"}
    look_only_exemptions: []

  - id: nl.co.alarm
    family: co
    zone: alarm
    parts:
      nl: [co melder, comelder, koolmonoxide, rookgaslucht, uitlaatlucht]
      en: [co alarm, co detector, carbon monoxide, flue gas smell, smell of flue gas]
    verbs: {nl: [], en: []}
    action: STOP
    line:
      nl: "Gaat de koolmonoxidemelder af? Ga naar buiten en bel buiten 112."
      en: "Carbon monoxide alarm? Go outside and call 112 from outside."
    script:
      nl: "Gaat de koolmonoxidemelder af? Waarschuw iedereen in huis, ga direct naar buiten en bel buiten 112. Ga pas weer naar binnen als de hulpdienst zegt dat het veilig is."
      en: "A carbon monoxide alarm means leave now. Warn everyone in the house, go outside, and call 112 from outside. Don't go back in until the emergency services say it's safe."
    ring_cm: 3
    landlord: false
    sources:
      - {title: "co-wijzer.nl: veelgestelde vragen", url: "https://www.co-wijzer.nl/"}
      - {title: "Brandweer: koolmonoxide", url: "https://www.brandweer.nl/onderwerpen/koolmonoxide/"}
    look_only_exemptions: []

  - id: nl.heat.fire
    family: heat
    zone: fire
    parts:
      nl: [ik zie rook, er komt rook, rook uit, het rookt, vlammen, vonken, staat in brand, vlam in]
      en: [smoke, on fire, flames, sparks, sparking, a fire]
    verbs: {nl: [], en: []}
    action: STOP
    line:
      nl: "Rook of vuur? Ga met iedereen naar buiten en bel 112."
      en: "Smoke or fire? Get everyone out and call 112."
    script:
      nl: "Ga met iedereen naar buiten, doe de deuren achter je dicht en bel 112."
      en: "Get everyone out, close the doors behind you and call 112."
    ring_cm: 3
    landlord: false
    sources:
      - {title: "Brandweer", url: "https://www.brandweer.nl/"}
      - {title: "Samsung WW5000C user manual", section: "Safety information"}
    look_only_exemptions: []

  - id: nl.heat.burning
    family: heat
    zone: burning
    parts:
      nl: [brandlucht, schroeilucht, ruikt branderig, ruikt verbrand, ruikt naar verbrand, smeulend]
      en: [burning smell, smell of burning, smells burnt, smells like burning, smouldering, smoldering]
    verbs: {nl: [], en: []}
    action: STOP
    line:
      nl: "Een brandlucht is voor de servicedienst. Ik ga hier niet verder."
      en: "A burning smell is for the service engineer. I won't go on with this."
    script:
      nl: "Stop met het apparaat. Is de stekker droog en makkelijk te pakken, trek hem er dan nu uit; anders zet je de groep in de meterkast uit. Zet het niet weer aan. Zie je rook, ga dan naar buiten en bel 112. Dit is voor de servicedienst van de fabrikant."
      en: "Stop using it. If the plug is dry and easy to reach, pull it out now; otherwise switch off its group in the meter cupboard. Don't restart it. If you see smoke, leave and call 112. This needs the manufacturer's service."
    ring_cm: 3
    landlord: false
    sources:
      - {title: "Samsung WW5000C user manual", section: "Safety information: strange noise, burning smell or smoke"}
      - {title: "Bosch SMV4HAX40N gebruiksaanwijzing", section: "Veiligheid: beschadigd apparaat"}
    look_only_exemptions: []

  - id: nl.water.flood
    family: water
    zone: flood
    parts:
      nl: [water bij de stekker, water bij het stopcontact, water in de meterkast, natte stekker, nat stopcontact, staat onder water, onder water gelopen]
      en: [water on the socket, water near the socket, water on the plug, wet plug, wet socket, water in the consumer unit, flooded]
    verbs: {nl: [], en: []}
    action: STOP
    line:
      nl: "Water bij de stroom: raak de stekker niet aan. Ik ga hier niet verder."
      en: "Water near the power: don't touch the plug. I won't go on with this."
    script:
      nl: "Raak de stekker en het stopcontact niet aan met natte handen. Draai de waterkraan dicht en zet de stroom uit in de meterkast, die groep of de hoofdschakelaar. Bel daarna de servicedienst."
      en: "Don't touch the plug or the socket with wet hands. Turn off the water tap, then switch off the power at the meter cupboard: that group, or the main switch. Then call service. I won't continue this repair."
    ring_cm: 3
    landlord: false
    sources:
      - {title: "Samsung WW5000C user manual", section: "Safety information: flooded appliance, wet hands"}
      - {title: "Enexis: zelf klussen in de meterkast", url: "https://www.enexis.nl/meter-en-meterkast/meterkast/zelf-klussen-in-de-meterkast"}
    look_only_exemptions: []

  # ---------- Gas: the boiler's gas side is a CO-vrij certified company's, by law since 1 April 2023. ----------
  - id: nl.gas.tap
    family: gas
    zone: tap
    parts:
      nl: [gaskraan, gasleiding, gasafsluiter, gasafsluitkraan, gasaansluiting, gastoevoer, gele kraan, gasblok, gasklep, brander, gasslang, gasinlaat, gasventiel]
      en: [gas tap, gas valve, gas pipe, gas line, gas supply, gas cock, gas shut off, gas shutoff, yellow tap, yellow handle, burner, gas inlet, gas hose, gas connection, gas fitting]
    verbs: {nl: [], en: []}
    action: STOP
    line:
      nl: "Dat is de gastoevoer. Aan gas werkt alleen een CO-vrij gecertificeerd bedrijf. Ruik je gas? 0800-9009."
      en: "That's the gas supply. Gas work needs a certified gas installer (CO-vrij). Smell gas? 0800-9009."
    script:
      nl: "Dat is de gastoevoer: handen terug. Was je de ketel aan het bijvullen, draai dan de kraan op de vulslang dicht. Aan gas werkt alleen een CO-vrij gecertificeerd bedrijf. Ruik je gas? Bel 0800-9009."
      en: "That's the gas supply: hands back. If you were topping up the boiler, close the tap on the filling hose. Gas work needs a certified gas installer (CO-vrij). Smell gas? Call 0800-9009."
    ring_cm: 3
    landlord: true
    sources:
      - {title: "Rijksoverheid: hoe voorkom ik koolmonoxidevergiftiging in mijn huis?", url: "https://www.rijksoverheid.nl/documenten/vraag-en-antwoord/gezonde-en-veilige-leefomgeving/hoe-voorkom-ik-koolmonoxidevergiftiging-in-mijn-huis"}
      - {title: "TLoKB: veelgestelde vragen over CO-vrij", url: "https://www.tlokb.nl/werkzaamheden-aan-gasverbrandingsinstallaties/veelgestelde-vragen-over-co-vrij"}
    # The guide's own look-only card lines. Exactly these lines pass the part-name hold; any edit is held.
    #   21725f85…: "The yellow tap is gas. Check it's open: just look."
    #   164cac47…: "De gele kraan is gas. Kijk of hij open staat: alleen kijken."
    look_only_exemptions:
      - 21725f8528f3df1106ba28c83b635b761ea98d53cf334c182d6d7ceab8719578
      - 164cac472e211e6e8af14e18c3beecaf4c0ded43660c2ed759745bd14f365ad4

  - id: nl.gas.casing
    family: gas
    zone: casing
    parts:
      nl: [mantel, ketelmantel, frontplaat van de ketel, kap van de ketel, ketelkast openen, voorkant van de ketel eraf, voorkant van de ketel open, voorkant van de ketel los, ketelkap, ketelkast]
      en: [boiler casing, boiler front panel, front cover of the boiler, front panel of the boiler, inside the boiler, open the boiler, boiler front cover, boiler's front cover, front off the boiler, cover off the boiler, cover on the boiler, front of the boiler open, front of the boiler off]
    verbs: {nl: [], en: []}
    action: STOP
    line:
      nl: "De mantel openmaken is werk voor een CO-vrij gecertificeerd bedrijf."
      en: "Opening the boiler casing needs a certified gas installer (CO-vrij)."
    script:
      nl: "Hier stop ik. De mantel openmaken is werk voor een gecertificeerde monteur, wettelijk en voor je veiligheid. Waar ik wel bij help: de waterdruk, bijvullen, radiatoren ontluchten en resetten."
      en: "I'll stop here. Opening the casing needs a certified gas installer (CO-vrij), both legally and for safety. What I can help with is the pressure, topping up, bleeding radiators and a reset."
    ring_cm: 3
    landlord: true
    sources:
      - {title: "TLoKB: veelgestelde vragen over CO-vrij", url: "https://www.tlokb.nl/werkzaamheden-aan-gasverbrandingsinstallaties/veelgestelde-vragen-over-co-vrij"}
      - {title: "Nefit TrendLine II gebruikershandleiding", section: "Veiligheid: verwijder nooit de mantel"}
    look_only_exemptions: []

  - id: nl.gas.boiler
    family: gas
    zone: boiler
    parts:
      nl: [warmtewisselaar, ontstekingselektrode, ontstekingspen, ionisatiepen, verbrandingskamer, ketelventilator, printplaat van de ketel, branderdeur]
      en: [heat exchanger, ignition electrode, ignition probe, ionisation probe, combustion chamber, boiler fan, boiler circuit board, boiler pcb]
    verbs: {nl: [], en: []}
    action: STOP
    line:
