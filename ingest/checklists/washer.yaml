- id: washer.drain_pump_filter
  names:
    en: Clean the drain pump filter
    nl: Pompfilter van de afvoerpomp reinigen
  kind: upkeep
  who: user
  evidence: 7
  note: the headline job; it usually holds the emergency drain of the water left in the machine
- id: washer.emergency_drain
  names:
    en: Drain the water left in the machine
    nl: Restwater aftappen (noodafvoer)
  kind: fix
  who: user
  evidence: 1
