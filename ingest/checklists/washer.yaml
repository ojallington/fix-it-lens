# The jobs a washer manual usually gives, by name only (no manual text), from the
# eval checklists (eval/checklists, derived from the gold cards). The builder asks the reader about each
# user item; it never writes a step from one. evidence: how many of the `of` gold manuals hold the item.
appliance_kind: washer
of: 7
