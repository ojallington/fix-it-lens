# What a washing-machine manual usually gives, derived from the gold cards (eval/gold.py). Names only, no quotes.
# who: user (the manual gives the user a procedure) or professional (the manual sends it to a technician).
# gold: <card>:<job id> for a user item, <card> for a professional one. Format and checks: eval/checklist.py.
appliance_kind: washer
gold_cards: [aeg__LR7696UD4, beko__BM1WT3921W, beko__BM3WFT3941B, bosch__WAU28S01NL, miele__WQ_1200_WPS,
             siemens__WMN16T3471_20, whirlpool__FFB_7458_WV_UK]
items:
  # upkeep the user does
  - id: washer.drain_pump_filter
    names: {en: Clean the drain pump filter, nl: Pompfilter van de afvoerpomp reinigen}
    kind: upkeep
    who: user
    evidence: 7
    note: the headline job; it usually holds the emergency drain of the water left in the machine
    gold: [aeg__LR7696UD4:clean_drain_pump_filter, beko__BM1WT3921W:clean_pump_filter,
           beko__BM3WFT3941B:clean_pump_filter, bosch__WAU28S01NL:clean_drain_pump,
           miele__WQ_1200_WPS:clean_drain_filters, siemens__WMN16T3471_20:clean_drain_pump,
           whirlpool__FFB_7458_WV_UK:clean_water_filter]
