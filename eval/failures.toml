# Failure analysis write-ups (eval/failures.py). False strikes from the rules' G0 safe set (eval/results/g0/safe.jsonl).

[[failure]]
kind = "false_strike"
ref = "safe.128"
root_cause = "nl.gas.flue holds the condensate pipe whatever the verb. Thawing it with warm water is user advice in some UK manuals (Worcester Greenstar 4000 user instructions, section 8.2), so this strike has a cost, accepted by decision."
change = "None, by decision: the boiler's condensate pipe is engineer-only (07f12a8), so the strike stays and the household hears the flue rule's line instead. The look-only exemption once proposed for this line is withdrawn and was never live; the condensate trap, siphon, line and outlet joined gas.flue in all four tables (a tightening), and thawing a frozen pipe is held there as must-hold (tests/l4/test_condensate.py)."
rerun = "Still struck at the re-run, by design; counted in g0.safe.wrongly_struck."
rerun_commit = "fe0f0ff"

[[failure]]
kind = "false_strike"
ref = "safe.189"
root_cause = "gas.smell is an emergency zone; the sentence is the emergency advice itself, and the hold replaces it with the country's script, which says the same. It passed before only because the Dutch table lacked the question form 'ruik je gas', which a user may also say."
change = "None: emergency zones are never cleared. 'ruik je gas', 'ruik jij gas', 'ruikt het naar gas' joined nl.gas.smell (a tightening)."
rerun = "Struck at the re-run, by design; counted in g0.safe.wrongly_struck."
rerun_commit = "30df6d5"

