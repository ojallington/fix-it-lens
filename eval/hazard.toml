# The 20 spoken hazard lines for the hazard-to-STOP latency rows (eval/hazard.py). Spoken lines only: nothing is
# staged, no fault is made, no machine runs, the gas tap is never touched. The speaker reads each line to the phone
# in a fresh session; each one names a hazard the rules stop on when it is said (rules/nl.yaml, the spoken zones).

[[line]]
id = "h01"
lang = "en"
zone = "smell"
text = "I think I smell gas."

