# The Fix-It Lens add-on: the whole app inside Home Assistant, with a panel in the sidebar (deploy/ha_addon.py).
# The Supervisor builds it from this folder once stage.py has put the app's source beside it (README.md here).
name: Fix-It Lens
version: "0.1.0"
slug: fixit_lens
description: Upkeep from your own appliance manuals, with a camera guide on your phone, in your sidebar.
arch: [amd64, aarch64]
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:wrench-clock
panel_title: Fix-It Lens
discovery: [fixit_lens]
map:
  - type: ssl
  - type: addon_config
    read_only: true
ports:
  8790/tcp: null
ports_description:
  8790/tcp: The app for your phone (turn on ssl)
options:
  calls: replay
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
schema:
  calls: list(replay|live)
  phone_url: url?
  ssl: bool
  certfile: str
  keyfile: str
