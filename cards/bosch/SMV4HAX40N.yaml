quotes:
- id: q_machine_cleaning_interval
  text: Als het apparaat geen herinneringsfunctie heeft, adviseren wij u om de machinereiniging om de 2 maanden uit te voeren.
  lang: nl
  page: 42
  en: If the appliance has no reminder function, we advise you to run Machine Clean every 2 months.
- id: q_fill_rinse_aid_lift_rinse_aid_cover
  text: De lip aan het deksel van het glansspoelmiddelreservoir indrukken en optillen.
  lang: nl
  page: 27
  en: Press the tab on the lid of the rinse aid reservoir and lift it.
- id: q_fill_rinse_aid_fill_rinse_aid_to_max
  text: Het glansspoelmiddel tot de markering max bijvullen.
  lang: nl
  page: 28
  en: Top up the rinse aid to the max mark.
- id: q_fill_rinse_aid_remove_spilled_rinse_aid
  text: Als er glansspoelmiddel is overgelopen, moet dit uit de spoelmiddelhouder worden verwijderd.
  lang: nl
  page: 28
  en: If rinse aid has spilled over, it must be removed from the rinse aid dispenser.
- id: q_fill_rinse_aid_close_rinse_aid_cover
  text: Het deksel van het glansspoelmiddelreservoir sluiten.
  lang: nl
  page: 28
  en: Close the lid of the rinse aid reservoir.
- id: q_clean_filters_check_filters
  text: Na elke afwasbeurt de zeven op etensresten controleren.
  lang: nl
  page: 42
  en: After every wash, check the filters for food remains.
- id: q_clean_filters_remove_filter_system
  text: De grove zeef tegen de klok in draaien en het zeefsysteem eruit nemen.
  lang: nl
  page: 43
  en: Turn the coarse filter anticlockwise and take the filter system out.
- id: q_clean_filters_remove_micro_filter
  text: De microzeef naar beneden lostrekken.
  lang: nl
  page: 43
  en: Pull the micro filter downwards to release it.
- id: q_clean_filters_remove_coarse_filter
  text: De vergrendelingsstukken samendrukken en de grove zeef er naar boven uitnemen.
  lang: nl
  page: 43
  en: Squeeze the locking pieces together and lift the coarse filter up and out.
- id: q_clean_filters_clean_filter_elements
  text: De zeefelementen onder stromend water reinigen.
  lang: nl
  page: 43
  en: Clean the filter parts under running water.
- id: q_clean_filters_reassemble_filter_system
  text: Het zeefsysteem in elkaar zetten.
  lang: nl
  page: 43
  en: Put the filter system back together.
- id: q_clean_filters_refit_filter_system
  text: Het zeefsysteem in het apparaat plaatsen en de grove zeef met de klok mee draaien.
  lang: nl
  page: 43
  en: Put the filter system into the appliance and turn the coarse filter clockwise.
- id: q_clean_filters_check_arrow_marks
  text: Controleer of de pijlmarkeringen tegenover elkaar staan.
  lang: nl
  page: 43
  en: Check that the arrow marks are opposite each other.
- id: q_clean_spray_arms_remove_upper_spray_arm
  text: De bovenste sproeiarm losschroeven en naar beneden lostrekken.
  lang: nl
  page: 44
  en: Unscrew the upper spray arm and pull it downwards to release it.
- id: q_clean_spray_arms_remove_lower_spray_arm
  text: De onderste sproeiarm naar boven lostrekken.
  lang: nl
  page: 44
  en: Pull the lower spray arm upwards to release it.
- id: q_clean_spray_arms_check_and_clear_spray_arm_jets
  text: De uitstroomopeningen van de sproeiarmen onder stromend water op verstoppingen controleren en eventuele vreemde voorwerpen
    verwijderen.
  lang: nl
  page: 44
  en: Check the outlet holes of the spray arms for blockages under running water and remove any foreign objects.
- id: q_clean_spray_arms_refit_lower_spray_arm
  text: De onderste sproeiarm aanbrengen.
  lang: nl
  page: 44
  en: Fit the lower spray arm.
- id: q_clean_spray_arms_refit_upper_spray_arm
  text: De bovenste sproeiarm aanbrengen en vastschroeven.
  lang: nl
  page: 44
  en: Fit the upper spray arm and screw it tight.
- id: q_machine_cleaning_remove_coarse_dirt
  text: Grove verontreinigingen in de binnenruimte met een vochtige doek verwijderen.
  lang: nl
  page: 42
  en: Remove coarse dirt from the interior with a damp cloth.
- id: q_machine_cleaning_clean_filters_place_care_product
  text: De zeven reinigen. Het machineonderhoudsmiddel in de binnenruimte van het apparaat plaatsen.
  lang: nl
  page: 42
  en: Clean the filters. Place the machine care product in the interior of the appliance.
- id: q_machine_cleaning_fill_detergent_dispenser
  text: De machinereiniger in het vaatwasmiddelbakje doen tot dit volledig gevuld is.
  lang: nl
  page: 42
  en: Put machine cleaner in the detergent dispenser until it is completely full.
- id: q_clean_drain_pump_remove_upper_lower_racks
  text: Verwijder de bovenste en onderste servieskorf.
  lang: nl
  page: 59
  en: Remove the upper and lower racks.
- id: q_clean_drain_pump_clean_drain_pump-remove_filter_system
  text: Verwijder het zeefsysteem.
  lang: nl
  page: 59
  en: Remove the filter system.
- id: q_clean_drain_pump_scoop_out_water
  text: Schep het aanwezige water eruit. Gebruik hiervoor zo nodig een spons.
  lang: nl
  page: 59
  en: Scoop out the water that is there. Use a sponge for this if needed.
- id: q_clean_drain_pump_lift_pump_cover
  text: De pompafdekking met behulp van een lepel opwippen en aan de beugel vastpakken.
  lang: nl
  page: 59
  en: Lever up the pump cover with a spoon and take hold of it by the bracket.
- id: q_clean_drain_pump_remove_pump_cover
  text: De pompafdekking schuin naar binnen optillen en verwijderen.
  lang: nl
  page: 59
  en: Lift the pump cover diagonally inwards and remove it.
- id: q_clean_drain_pump_remove_impeller_remnants
  text: Etensresten en vreemde voorwerpen bij de pompwaaier verwijderen.
  lang: nl
  page: 59
  en: Remove food remains and foreign objects at the pump impeller.
- id: q_clean_drain_pump_refit_pump_cover
  text: De pompafdekking aanbrengen en omlaag drukken.
  lang: nl
  page: 59
  en: Fit the pump cover and press it down.
- id: q_clean_drain_pump_clean_drain_pump-refit_filter_system
  text: Het zeefsysteem monteren.
  lang: nl
  page: 59
  en: Fit the filter system.
- id: q_clean_drain_pump_refit_upper_lower_racks
  text: De onderste en bovenste servieskorf aanbrengen.
  lang: nl
  page: 59
  en: Fit the lower and upper racks.
- id: q_fix_e3200_inlet_sieve_close_tap_unscrew_water_connector
  text: Draai de kraan dicht. Schroef de wateraansluiting los.
  lang: nl
  page: 45
  en: Turn the tap off. Unscrew the water connection.
- id: q_fix_e3200_inlet_sieve_remove_sieve_from_supply_hose
  text: Neem de zeef uit de toevoerslang
  lang: nl
  page: 46
  en: Take the filter out of the supply hose
- id: q_fix_e3200_inlet_sieve_clean_replace_inlet_sieve
  text: Reinig de zeef. Plaats de zeef in de toevoerslang.
  lang: nl
  page: 46
  en: Clean the filter. Put the filter in the supply hose.
- id: q_fix_e3200_inlet_sieve_tighten_water_connection
  text: Schroef de wateraansluiting vast.
  lang: nl
  page: 46
  en: Screw the water connection tight.
- id: q_fix_e3200_inlet_sieve_check_water_connection_leaks
  text: Controleer de wateraansluiting op lekkage.
  lang: nl
  page: 46
  en: Check the water connection for leaks.
- id: q_fix_e3200_inlet_sieve_open_tap
  text: Draai de kraan open.
  lang: nl
  page: 45
  en: Turn the tap on.
- id: q_fix_e9240_clean_sieves_clean_sieves
  text: Zeven zijn vuil of verstopt. Reinig de zeven.
  lang: nl
  page: 47
  en: The filters are dirty or blocked. Clean the filters.
- id: q_machine_cleaning_start_machine_clean
  text: Voer het programma Machinereiniging zonder ingeruimd serviesgoed uit.
  lang: nl
  page: 42
  en: Run the Machine Clean programme without any dishes loaded.
